<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="業務タスク管理 - プロジェクトとタスクを一元管理する高機能ツール">
  <title>業務タスク管理 | Focus Ops</title>
  
  <!-- CSS Modules -->
  <link rel="stylesheet" href="./css/variables.css?v=2.0.0">
  <link rel="stylesheet" href="./css/base.css?v=2.0.0">
  <link rel="stylesheet" href="./css/layout.css?v=2.0.0">
  <link rel="stylesheet" href="./css/components.css?v=2.0.0">
  <link rel="stylesheet" href="./css/tasks.css?v=2.0.0">
  <link rel="stylesheet" href="./css/modals.css?v=2.0.0">
  <link rel="stylesheet" href="./css/responsive.css?v=2.0.0">
  
  <!-- JavaScript Modules -->
  <script defer src="./js/constants.js?v=2.0.0"></script>
  <script defer src="./js/storage.js?v=2.0.0"></script>
  <script defer src="./js/state.js?v=2.0.0"></script>
  <script defer src="./js/utils.js?v=2.0.0"></script>
  <script defer src="./js/taskMetadata.js?v=2.0.0"></script>
  <script defer src="./js/taskRenderer.js?v=2.0.0"></script>
  <script defer src="./js/menuHandlers.js?v=2.0.0"></script>
  <script defer src="./js/settings.js?v=2.0.0"></script>
  <script defer src="./js/eventHandlers.js?v=2.0.0"></script>
  <script defer src="./js/main.js?v=2.0.0"></script>
</head>

<body>
  <!-- スクリーンリーダー用ライブリージョン -->
  <div id="sr-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="container">
    <header>
      <div class="header-content">
        <div>
          <a href="index.html" class="home-link">← ホームに戻る</a>
          <h1 class="title">業務タスク管理</h1>
          <p class="subtitle">プロジェクトとタスクを一元管理</p>
        </div>
        <div class="mobile-actions">
          <button 
            id="menuToggleBtn" 
            class="menu-toggle" 
            type="button" 
            aria-label="メニューを開く"
            aria-expanded="false"
          >
            <span class="hamburger-icon"></span>
            <span class="hamburger-icon"></span>
            <span class="hamburger-icon"></span>
          </button>
        </div>
      </div>
    </header>

    <nav class="topbar" id="topbar" role="navigation" aria-label="タスク管理操作">
      <button
        id="settingsBtn"
        class="btn-main"
        type="button"
      >
        ⚙ 設定
      </button>

      <button
        id="minimumBtn"
        class="btn-main toggle-btn"
        type="button"
        aria-pressed="false"
      >
        最低限モード OFF
      </button>

      <div class="reset-dropdown-wrap">
        <button
          id="resetMenuBtn"
          class="btn-main"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
        >
          🔄 リセット ▾
        </button>
        <div id="resetDropdown" class="reset-dropdown" hidden>
          <button class="reset-dropdown-item" type="button" id="dailyResetBtn" data-category="daily">
            <span class="reset-item-label">今日リセット</span>
            <span class="reset-item-desc">今日のチェックを解除</span>
          </button>
          <button class="reset-dropdown-item" type="button" id="weeklyResetBtn" data-category="weekly">
            <span class="reset-item-label">今週リセット</span>
            <span class="reset-item-desc">今週のチェックを解除</span>
          </button>
          <button class="reset-dropdown-item" type="button" id="seasonResetBtn" data-category="season">
            <span class="reset-item-label">長期リセット</span>
            <span class="reset-item-desc">長期タスクのチェックを解除</span>
          </button>
          <div class="reset-dropdown-divider"></div>
          <button class="reset-dropdown-item reset-dropdown-item--danger" type="button" id="resetAllBtn">
            <span class="reset-item-label">全リセット</span>
            <span class="reset-item-desc">全てのデータを初期化</span>
          </button>
        </div>
      </div>

      <button
        id="kanbanViewBtn"
        class="btn-main toggle-btn"
        type="button"
      >
        カンバンビュー
      </button>
    </nav>

    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- システムステータス -->
    <section class="system-status" aria-label="システムステータス">
      <div class="status-grid">
        <div class="status-item">
          <div class="status-label">LAST SYNC</div>
          <div class="status-value" id="lastSyncTime">--:--</div>
        </div>
        <div class="status-item">
          <div class="status-label">OVERALL COMPLETION</div>
          <div class="status-value" id="overallCompletion">0%</div>
        </div>
      </div>
    </section>

    <main class="grid" aria-label="タスクリスト">
      <section class="card" aria-labelledby="daily-title">
        <h2 id="daily-title">📅 今日のタスク</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="dailyRemain" aria-live="polite"></span>
            <span id="dailyProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="デイリー進捗">
            <div class="progress-bar" id="dailyBar"></div>
          </div>
        </div>

        <div id="dailyContainer"></div>
      </section>

      <section class="card" aria-labelledby="weekly-title">
        <h2 id="weekly-title">📆 今週のタスク</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="weeklyRemain" aria-live="polite"></span>
            <span id="weeklyProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="ウィークリー進捗">
            <div class="progress-bar" id="weeklyBar"></div>
          </div>
        </div>

        <div id="weeklyContainer"></div>
      </section>

      <section class="card" aria-labelledby="season-title">
        <h2 id="season-title">📊 長期のタスク</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="seasonRemain" aria-live="polite"></span>
            <span id="seasonProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="シーズン進捗">
            <div class="progress-bar" id="seasonBar"></div>
          </div>
        </div>

        <div id="seasonContainer"></div>
      </section>
    </main>

    <!-- カンバンボード -->
    <div id="kanbanBoard" class="kanban-board" style="display:none;"></div>

    <footer class="info">
      赤 = 高優先度 / 黄 = 中優先度 / 青 = 低優先度<br>
      LocalStorage保存対応
    </footer>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="modal" role="dialog" aria-labelledby="settingsModalTitle" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settingsModalTitle">タスク設定</h2>
        <button id="closeSettingsBtn" class="close-btn" type="button" aria-label="閉じる">&times;</button>
      </div>

      <div class="modal-body">
        <div class="tabs">
          <button id="visibilityTab" class="tab-btn active" type="button">表示設定</button>
          <button id="customTaskTab" class="tab-btn" type="button">カスタムタスク</button>
          <button id="tagProjectTab" class="tab-btn" type="button">タグ・プロジェクト</button>
          <button id="kanbanTab" class="tab-btn" type="button">カンバン管理</button>
        </div>

        <!-- 表示設定タブ -->
        <div id="visibilityPanel" class="tab-panel active">
          <div class="panel-header">
            <p class="panel-description">各タスクの表示/非表示を設定できます。</p>
            <button id="resetVisibilityBtn" class="btn-main btn-small" type="button">表示設定をリセット</button>
          </div>
          
          <div class="settings-section">
            <h3>デイリー</h3>
            <div id="dailyVisibilitySettings" class="task-list"></div>
          </div>

          <div class="settings-section">
            <h3>ウィークリー</h3>
            <div id="weeklyVisibilitySettings" class="task-list"></div>
          </div>

          <div class="settings-section">
            <h3>シーズン / 隔週</h3>
            <div id="seasonVisibilitySettings" class="task-list"></div>
          </div>
        </div>

        <!-- カスタムタスクタブ -->
        <div id="customTaskPanel" class="tab-panel">
          <div class="panel-header">
            <p class="panel-description">独自のタスクを追加できます。</p>
            <div class="button-group">
              <button id="resetEditedDefaultTasksBtn" class="btn-main btn-small" type="button">デフォルトタスク編集をリセット</button>
              <button id="resetCustomTasksBtn" class="btn-danger btn-small" type="button">全カスタムタスクを削除</button>
            </div>
          </div>
          
          <form id="addTaskForm" class="add-task-form">
            <div class="form-group">
              <label for="taskType">カテゴリ</label>
              <select id="taskType" required>
                <option value="daily">デイリー</option>
                <option value="weekly">ウィークリー</option>
                <option value="season">シーズン / 隔週</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskTitle">タスク名</label>
              <input type="text" id="taskTitle" placeholder="例: 新しいタスク" required>
            </div>

            <div class="form-group">
              <label for="taskPriority">優先度（自動でサブカテゴリ分けされます）</label>
              <select id="taskPriority" required>
                <option value="high">高（優先度：高）- 赤</option>
                <option value="mid">中（優先度：中）- 黄</option>
                <option value="low">低（余裕があれば）- 青</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskProject">プロジェクト（任意）</label>
              <select id="taskProject">
                <option value="">選択してください</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskDeadline">締め切り（任意）</label>
              <input type="date" id="taskDeadline">
            </div>

            <div class="form-group">
              <label for="taskTags">タグ（任意・複数選択可）</label>
              <div id="taskTags" class="tag-selector"></div>
            </div>

            <div class="form-group">
              <label for="taskEstimatedTime">予想作業時間（任意）</label>
              <div class="time-input-group">
                <input type="number" id="taskEstimatedHours" min="0" max="99" placeholder="0">
                <span>時間</span>
                <input type="number" id="taskEstimatedMinutes" min="0" max="59" placeholder="0">
                <span>分</span>
              </div>
            </div>

            <div class="form-group">
              <label for="taskComment">メモ（任意）</label>
              <textarea id="taskComment" placeholder="例: 毎週月曜日に実施" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-main">タスクを追加</button>
          </form>

          <div class="settings-section">
            <h3>追加済みカスタムタスク</h3>
            <div id="customTaskList" class="custom-task-list"></div>
          </div>

        </div>

        <!-- タグ・プロジェクトタブ -->
        <div id="tagProjectPanel" class="tab-panel">
          <div class="settings-section">
            <h3>タグ管理</h3>
            <form id="tagManagerForm" class="add-task-form">
              <div class="form-group">
                <label for="tagManagerName">タグ名</label>
                <input type="text" id="tagManagerName" maxlength="20" placeholder="例: 顧客対応" required>
              </div>
              <div class="form-group">
                <label for="tagManagerColor">色</label>
                <input type="color" id="tagManagerColor" value="#3b82f6" required>
              </div>
              <button type="submit" class="btn-main">タグを追加</button>
              <button type="button" id="tagManagerCancelEdit" class="btn-secondary cancel-edit-btn">編集をキャンセル</button>
            </form>
            <div id="tagManagerList" class="custom-task-list"></div>
          </div>

          <div class="settings-section">
            <h3>プロジェクト管理</h3>
            <form id="projectManagerForm" class="add-task-form">
              <div class="form-group">
                <label for="projectManagerName">プロジェクト名</label>
                <input type="text" id="projectManagerName" maxlength="20" placeholder="例: 新規施策" required>
              </div>
              <div class="form-group">
                <label for="projectManagerColor">色</label>
                <input type="color" id="projectManagerColor" value="#8b5cf6" required>
              </div>
              <button type="submit" class="btn-main">プロジェクトを追加</button>
              <button type="button" id="projectManagerCancelEdit" class="btn-secondary cancel-edit-btn">編集をキャンセル</button>
            </form>
            <div id="projectManagerList" class="custom-task-list"></div>
          </div>
        </div>

        <!-- カンバン管理タブ -->
        <div id="kanbanPanel" class="tab-panel">
          <div class="settings-section">
            <h3>ステータス管理</h3>
            <div class="panel-header">
              <p class="panel-description">カンバンのステータスを追加・編集・削除できます。</p>
              <button type="button" class="btn-main btn-small" onclick="resetKanbanStatuses()">デフォルトに戻す</button>
            </div>
            <form id="statusManagerForm" class="add-task-form">
              <div class="form-group">
                <label for="statusManagerName">ステータス名</label>
                <input type="text" id="statusManagerName" maxlength="20" placeholder="例: テスト中" required>
              </div>
              <div class="form-group">
                <label for="statusManagerColor">色</label>
                <input type="color" id="statusManagerColor" value="#6b7280" required>
              </div>
              <button type="submit" class="btn-main">ステータスを追加</button>
              <button type="button" id="statusManagerCancelEdit" class="btn-secondary cancel-edit-btn" style="display:none;">編集をキャンセル</button>
            </form>
            <div id="statusManagerList" class="custom-task-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- トーストコンテナ -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="作業管理ツール - デイリータスクと作業表を一元管理">
  <title>Focus Ops - 作業管理ツール</title>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WPV9BG4YSJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WPV9BG4YSJ');
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease;
    }

    .header h1 {
      font-size: 3rem;
      color: #fff;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.02em;
    }

    .header p {
      font-size: 1.1rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .tool-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      color: inherit;
      display: block;
      border: 2px solid transparent;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      border-color: #667eea;
    }

    .tool-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
    }

    .tool-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1e293b;
      letter-spacing: 0.01em;
    }

    .tool-description {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .tool-button {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      letter-spacing: 0.02em;
    }

    .tool-card:hover .tool-button {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      transform: scale(1.05);
    }

    .footer {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .footer p {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .header p {
        font-size: 1rem;
      }

      .tools-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .tool-card {
        padding: 30px 24px;
      }

      .tool-icon {
        font-size: 3rem;
      }

      .tool-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 Focus Ops</h1>
      <p>デイリータスクと作業表を一元管理</p>
    </div>

    <div class="tools-grid">
      <!-- デイリータスク管理 -->
      <a href="daily.html" class="tool-card">
        <span class="tool-icon">📋</span>
        <h2 class="tool-title">デイリータスク管理</h2>
        <p class="tool-description">
          日々のタスクをチェックリストで管理。<br>
          デイリー・ウィークリー・シーズンタスクを効率的に追跡できます。
        </p>
        <span class="tool-button">開く →</span>
      </a>

      <!-- 作業表ツール -->
      <a href="work_sheet.html" class="tool-card">
        <span class="tool-icon">📝</span>
        <h2 class="tool-title">作業表ツール</h2>
        <p class="tool-description">
          出退勤時刻と作業内容を記録。<br>
          日々の業務を詳細に管理し、履歴を確認できます。
        </p>
        <span class="tool-button">開く →</span>
      </a>
    </div>

    <div class="footer">
      <p>© 2026 Focus Ops - All rights reserved</p>
    </div>
  </div>
</body>
</html>

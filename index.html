<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="作業管理ツール - 出退勤時刻と作業内容を記録する作業表ツール">
  <title>Focus Ops - 作業管理ツール</title>

  <script src="./js/theme.js"></script>
  <script>initTheme();</script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-main">
        <h1>🎯 Focus Ops</h1>
        <p>出退勤時刻と作業内容を記録する作業表ツール</p>
      </div>
      <button
        class="theme-toggle-btn"
        type="button"
        aria-label="ダークモードに切り替え"
        aria-pressed="false"
        onclick="toggleTheme()"
      >🌙</button>
    </div>

    <div class="tools-grid">
      <!-- 作業表ツール -->
      <a href="work_sheet.html" class="tool-card">
        <span class="tool-icon">📝</span>
        <h2 class="tool-title">作業表ツール</h2>
        <p class="tool-description">
          出退勤時刻と作業内容を記録。<br>
          日々の業務を詳細に管理し、履歴を確認できます。
        </p>
        <span class="tool-button">開く →</span>
      </a>
    </div>

    <div class="footer">
      <p>© 2026 Focus Ops - All rights reserved</p>
      <p class="footer-note">
        記録したデータはブラウザ内（LocalStorage）にのみ保存され、外部へ送信されません。
      </p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neverness to Everness デイリー・ウィークリー・シーズンタスク管理ツール">
  <title>NTE Task Tracker</title>
  <link rel="stylesheet" href="./styles.css?v=1.0.0">
</head>

<body>
  <!-- スクリーンリーダー用ライブリージョン -->
  <div id="sr-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="container">
    <header>
      <div class="header-content">
        <div>
          <h1 class="title">NTE TASK TRACKER</h1>
        </div>
        <div class="mobile-actions">
          <button
            id="dailyResetBtnMobile"
            class="btn-main mobile-only"
            type="button"
            data-category="daily"
          >
            デイリーリセット
          </button>
          <button 
            id="menuToggleBtn" 
            class="menu-toggle" 
            type="button" 
            aria-label="メニューを開く"
            aria-expanded="false"
          >
            <span class="hamburger-icon"></span>
            <span class="hamburger-icon"></span>
            <span class="hamburger-icon"></span>
          </button>
        </div>
      </div>
    </header>

    <nav class="topbar" id="topbar" role="navigation" aria-label="タスク管理操作">
      <button
        id="minimumBtn"
        class="btn-main toggle-btn"
        type="button"
        aria-pressed="false"
      >
        最低限モード OFF
      </button>

      <button
        id="dailyResetBtn"
        class="btn-main desktop-only"
        type="button"
        data-category="daily"
      >
        デイリーリセット
      </button>

      <button
        id="weeklyResetBtn"
        class="btn-main"
        type="button"
        data-category="weekly"
      >
        ウィークリーリセット
      </button>

      <button
        id="seasonResetBtn"
        class="btn-main"
        type="button"
        data-category="season"
      >
        シーズンリセット
      </button>

      <button
        id="resetAllBtn"
        class="btn-danger"
        type="button"
      >
        全リセット
      </button>
    </nav>

    <div class="menu-overlay" id="menuOverlay"></div>

    <main class="grid" aria-label="タスクリスト">
      <section class="card" aria-labelledby="daily-title">
        <h2 id="daily-title">デイリー</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="dailyRemain" aria-live="polite"></span>
            <span id="dailyProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="デイリー進捗">
            <div class="progress-bar" id="dailyBar"></div>
          </div>
        </div>

        <div id="dailyContainer"></div>
      </section>

      <section class="card" aria-labelledby="weekly-title">
        <h2 id="weekly-title">ウィークリー</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="weeklyRemain" aria-live="polite"></span>
            <span id="weeklyProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="ウィークリー進捗">
            <div class="progress-bar" id="weeklyBar"></div>
          </div>
        </div>

        <div id="weeklyContainer"></div>
      </section>

      <section class="card" aria-labelledby="season-title">
        <h2 id="season-title">シーズン / 隔週</h2>

        <div class="progress-wrap">
          <div class="progress-top">
            <span id="seasonRemain" aria-live="polite"></span>
            <span id="seasonProgress" aria-live="polite"></span>
          </div>

          <div class="progress" role="progressbar" aria-label="シーズン進捗">
            <div class="progress-bar" id="seasonBar"></div>
          </div>
        </div>

        <div id="seasonContainer"></div>
      </section>
    </main>

    <footer class="info">
      赤 = 高優先度 / 黄 = 中優先度 / 青 = 低優先度<br>
      LocalStorage保存対応
    </footer>
  </div>

  <script src="./script.js?v=1.0.0"></script>
</body>
</html>
